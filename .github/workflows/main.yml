name: Build LunarService

on:
  workflow_dispatch:

  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: lunarservice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_PLATFORM: 'android-35'
  BUILD_TOOLS_VERSION: '35.0.0'

jobs:
  build:
    name: Build LunarService APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. JDK 17
      #
      # Android SDK Command-line Tools 16.0 requires JDK 17+.
      # The project itself still compiles Java source/target 11.
      # ------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Check Java
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # ------------------------------------------------------------
      # 3. Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "${{ env.ANDROID_PLATFORM }}" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}"

      # ------------------------------------------------------------
      # 4. Verify Android environment
      # ------------------------------------------------------------
      - name: Check Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --version

          echo "Installed SDK platforms:"
          sdkmanager --list_installed | grep "platforms;android-" || true

          echo "Installed build tools:"
          sdkmanager --list_installed | grep "build-tools;" || true

      # ------------------------------------------------------------
      # 5. Verify repository structure
      # ------------------------------------------------------------
      - name: Check project files
        run: |
          test -f ./gradlew
          test -f ./settings.gradle.kts
          test -f ./build.gradle.kts
          test -f ./app/build.gradle.kts

          echo "Project structure:"
          find . -maxdepth 3 -type f | sort

      # ------------------------------------------------------------
      # 6. Check required local dependency
      #
      # LunarService currently declares:
      # app/libs/color.jar
      # ------------------------------------------------------------
      - name: Check color.jar
        run: |
          if [ ! -f "app/libs/color.jar" ]; then
            echo "::error::Missing app/libs/color.jar"
            echo "The project declares compileOnly(files(\"libs\\\\color.jar\"))."
            exit 1
          fi

          echo "Found app/libs/color.jar"
          ls -lh app/libs/color.jar

      # ------------------------------------------------------------
      # 7. Gradle
      # ------------------------------------------------------------
      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      # ------------------------------------------------------------
      # 8. Clean build
      # ------------------------------------------------------------
      - name: Clean project
        run: ./gradlew clean --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      # ------------------------------------------------------------
      # 9. Verify APK
      # ------------------------------------------------------------
      - name: Verify Debug APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_COUNT=$(find app/build/outputs/apk/debug -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

      # ------------------------------------------------------------
      # 10. Upload APK
      # ------------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LunarService-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # 11. Upload mapping / build information if available
      # ------------------------------------------------------------
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LunarService-build-${{ github.sha }}
          path: |
            app/build/outputs/
          if-no-files-found: ignore
          retention-days: 7
